name: Deploy portfolio

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [profile-updated]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PROFILE_DIR: .profile-src
      VITE_CHAT_URL: ${{ vars.VITE_CHAT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout profile data
        uses: actions/checkout@v4
        with:
          repository: veck03/professional-profile
          path: .profile-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build   # prebuild syncs the profile data and builds knowledge.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4